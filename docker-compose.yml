services:
  telegram-uploader:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-uploader:latest
    container_name: telegram-uploader
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./config/users:/config/users
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
